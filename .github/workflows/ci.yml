name: CCTV CI/CD

on:
  push:
    branches: [main, develop, release, release/**]
  pull_request:
    branches: [main, release, release/**]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/cctv

jobs:
  # ── 1. 단위 테스트 ──────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Check sensitive defaults
        run: python scripts/health/check_sensitive_defaults.py

      - name: Check root generated files
        run: python scripts/health/check_root_generated_files.py

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: ${{ startsWith(github.ref, 'refs/heads/release') && 30 || 7 }}

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate docker compose files
        run: |
          docker compose config >/tmp/docker-compose.yml
          docker compose --env-file .env.jetson.example -f docker-compose.jetson.yml config >/tmp/docker-compose.jetson.yml

      - name: Deployment readiness smoke check
        run: python scripts/health/check_deployment_readiness.py --ci

  # ── 2. 보안 취약점 스캔 ─────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pip-audit (enforced on main)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release'))
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-action.txt

      - name: pip-audit (warning on non-main/PR)
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
          pip-audit -r requirements-action.txt || true

      - name: Trivy filesystem scan (enforced on main)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release'))
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy filesystem scan (warning on non-main/PR)
        if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release'))
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

  # ── 3. 이미지 빌드 & GHCR 푸시 ─────────────────────────────────────
  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image: ai-engine
            platforms: linux/amd64
          - dockerfile: Dockerfile.action
            image: action
            platforms: linux/amd64,linux/arm64
          - dockerfile: Dockerfile.parser
            image: parser
            platforms: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Jetson ARM64 빌드 (main 브랜치만) ───────────────────────────
  build-jetson:
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Jetson AI image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.jetson
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-jetson:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
