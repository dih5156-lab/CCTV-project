name: "aiot-t34955-inclinometer"
manufacturer: "AIoT"
model: "T34955"
description: "LwM2M Object 34955 - Inclinometer (angle X/Y)"
labels:
  - "aiot"
  - "inclinometer"
  - "lora"

deviceResources:
  - name: "angle_x"
    isHidden: true
    description: "X-axis angle (degrees)"
    properties:
      valueType: "Float64"
      readWrite: "R"
      units: "degree"
  - name: "angle_y"
    isHidden: true
    description: "Y-axis angle (degrees)"
    properties:
      valueType: "Float64"
      readWrite: "R"
      units: "degree"
  - name: "reporting_period"
    isHidden: true
    description: "Reporting period (seconds)"
    properties:
      valueType: "Float64"
      readWrite: "R"
      units: "second"
  - name: "reporting_angle_threshold"
    isHidden: true
    description: "Angle threshold for reporting (degrees)"
    properties:
      valueType: "Float64"
      readWrite: "R"
      units: "degree"

deviceCommands:
  - name: "inclinometer_reading"
    isHidden: true
    readWrite: "R"
    resourceOperations:
      - { deviceResource: "angle_x" }
      - { deviceResource: "angle_y" }
      - { deviceResource: "reporting_period" }
      - { deviceResource: "reporting_angle_threshold" }
