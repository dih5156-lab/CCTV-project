name: appearance-training-jetson

# Task 6 전용 학습 프로파일. 운영 CCTV compose와 분리해 GPU 학습 환경을 고정한다.
services:
  appearance-multitask-train:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    runtime: nvidia
    user: root
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/.venv-jetson-train/lib/python3.10/site-packages:/app
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      APPEARANCE_DATASET_ROOT: /app/data/datasets/aihub_kreid/015.한국인재식별이미지/01.데이터
      APPEARANCE_TRAINING_PYTHON: /app/.venv-jetson-train/bin/python
      APPEARANCE_DEVICE: cuda
      APPEARANCE_NATIVE11_CHECKPOINT: /app/Rethinking_of_PAR/exp_result/RAP2/aihub_kreid.resnet50.native11.smoke1/img_model/ckpt_max_2026-08-14_10:28:55.pth
      APPEARANCE_TRAIN_DATASET_DIR: ${APPEARANCE_TRAIN_DATASET_DIR:-}
      APPEARANCE_TRAIN_CONFIG: ${APPEARANCE_TRAIN_CONFIG:-}
      APPEARANCE_EXPERIMENT_DIR: ${APPEARANCE_EXPERIMENT_DIR:-}
    volumes:
      - type: bind
        source: ./.worktrees/appearance-multitask-v1
        target: /app
      - type: bind
        source: ./.venv-jetson-train
        target: /app/.venv-jetson-train
        read_only: true
      - type: bind
        source: ./data/datasets
        target: /app/data/datasets
        read_only: true
      - type: bind
        source: ./Rethinking_of_PAR
        target: /app/Rethinking_of_PAR
        read_only: true
    command: ["/bin/bash", "/app/scripts/train/run_appearance_multitask_v1.sh"]
