# docker-compose.server.yml — Windows PC 임시 서버 모드 override
#
# [용도] Jetson Orin이 AI를 담당하고, Windows PC가 EdgeX 서버 역할을 할 때 사용.
#
# [실행 방법]
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# [Jetson 실행 방법]
#   USE_GSTREAMER=1 DEVICE=cuda:0 python main.py \
#     --cameras cameras.json \
#     --mqtt-broker <이 PC의 IP> \   ← ipconfig 로 확인 (예: 192.168.0.10)
#     --mqtt-port 1883 \
#     --mqtt-topic-prefix cctv/ai/events
#
# [변경사항]
#   1. edgex-mqtt-broker: 포트를 0.0.0.0 으로 개방 → 외부(Jetson)에서 접근 가능
#   2. cctv-ai-engine: 비활성화(profile: disabled) → Jetson이 대체
#   3. cctv-edgex-adapter: ai-mqtt-broker를 환경변수 JETSON_MQTT_BROKER 로 오버라이드 가능

name: edgex

services:

  # ── MQTT 브로커: 외부(Jetson) 접근 허용 ──────────────────────────────────
  edgex-mqtt-broker:
    ports:
      - target: 1883
        published: "1883"
        protocol: tcp
        # host_ip 제거 → 0.0.0.0 (모든 인터페이스) 바인딩

  # ── AI 엔진: Jetson이 대체하므로 비활성화 ────────────────────────────────
  cctv-ai-engine:
    profiles:
      - disabled   # docker compose up 시 시작 안 됨

  # ── EdgeX 어댑터: Jetson MQTT 주소를 환경변수로 주입 ────────────────────
  #    기본값은 같은 네트워크 내 브로커(edgex-mqtt-broker)를 그대로 사용.
  #    Jetson이 외부 브로커(이 PC)에 직접 publish하므로 변경 불필요.
  #    (Jetson → 이 PC:1883 → edgex-mqtt-broker 컨테이너 통과 동일)
  cctv-edgex-adapter:
    environment:
      # Jetson이 연결하는 브로커와 동일한 호스트를 구독함
      # edgex-mqtt-broker 컨테이너명 그대로 사용 (내부 네트워크 동일)
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
