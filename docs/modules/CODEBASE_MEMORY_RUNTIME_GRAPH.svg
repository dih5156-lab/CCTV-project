      .shared { fill: #422006; stroke: #fbbf24; stroke-width: 2; rx: 9; }
      .label { fill: #e2e8f0; font: 16px sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #cbd5e1; font: 13px sans-serif; text-anchor: middle; }
      .heading { fill: #f8fafc; font: 700 22px sans-serif; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .edge-strong { fill: none; stroke: #f59e0b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .edge-label { fill: #cbd5e1; font: 12px sans-serif; text-anchor: middle; }
    </style>
