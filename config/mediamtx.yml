logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554

hls: no
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsEncryption: no
hlsVariant: fmp4
hlsAlwaysRemux: false
hlsSegmentDuration: 2s
hlsSegmentMaxSize: 250MB

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [192.168.88.137, 192.168.2.242, 192.168.0.10]

api: yes
apiAddress: :9997
apiAllowOrigins: ["*"]

paths:
  sample_eval:
    # cameras.json 의 sample_eval 카메라 ID와 WebRTC path 를 맞춘다.
    source: publisher

  all_others:
    # 카메라 ID별 RTSP publisher 경로를 동적으로 수락한다.
    # WebRTC는 동일한 path를 사용한다: http://<Jetson-IP>:8889/<camera_id>/
    source: publisher
