map $http_x_api_key $public_api_key_header {
    default $http_x_api_key;
    "" "${PUBLIC_API_KEY}";
}

server {
    listen 7000;
    server_name _;

    # Docker 내장 DNS — 컨테이너 재시작 후 IP 변경 시 자동 재조회
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index public-demo.html;

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /public-demo.html;
    }

    location /public-api/ {
        proxy_pass http://cctv-public-api:9000/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $public_api_key_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stream-api/ {
        return 410;
    }

    location /hls/ {
        return 410;
    }

    # HLS는 데모 라이브 표준 경로에서 제외한다.
    location ~ ^/([^/]+)/(index\.m3u8|.*\.ts|.*\.m4s|.*\.mp4|.*\.vtt) {
        return 410;
    }

    location /webrtc/ {
        proxy_pass http://cctv-media-server:8889/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect ~^/(.*)$ /webrtc/$1;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /zone-api/ {
        rewrite ^/zone-api/(.*) /$1 break;
        set $backend_zone "http://cctv-ai-engine:8765";
        proxy_pass $backend_zone;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /face-api/ {
        rewrite ^/face-api/(.*) /$1 break;
        set $backend_face "http://cctv-ai-engine:8767";
        proxy_pass $backend_face;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /model-api/ {
        rewrite ^/model-api/(.*) /$1 break;
        set $backend_model "http://cctv-ai-engine:8766";
        proxy_pass $backend_model;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
