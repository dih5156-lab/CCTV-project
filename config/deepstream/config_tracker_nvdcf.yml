%YAML:1.0
# Jetson crop-Pose용 NvDCF low-level tracker 설정.
# 필드명과 값 타입은 설치된 DeepStream SDK NvDCF 스키마를 따른다.

BaseConfig:
  minDetectorConfidence: 0.3

TargetManagement:
  enableBboxUnClipping: 1
  preserveStreamUpdateOrder: 1
  maxTargetsPerStream: 60
  minIouDiff4NewTarget: 0.5
  minTrackerConfidence: 0.2
  probationAge: 0
  maxShadowTrackingAge: 30
  earlyTerminationAge: 3

TrajectoryManagement:
  useUniqueID: 1

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  checkClassMatch: 1
  minMatchingScore4Overall: 0.4
  minMatchingScore4SizeSimilarity: 0.3
  minMatchingScore4Iou: 0.2
  minMatchingScore4VisualSimilarity: 0.4
  matchingScoreWeight4VisualSimilarity: 0.3
  matchingScoreWeight4SizeSimilarity: 0.3
  matchingScoreWeight4Iou: 0.4
  tentativeDetectorConfidence: 0.2
  minMatchingScore4TentativeIou: 0.4

StateEstimator:
  stateEstimatorType: 1
  processNoiseVar4Loc: 1.5
  processNoiseVar4Size: 1.3
  processNoiseVar4Vel: 0.03
  measurementNoiseVar4Detector: 3.0
  measurementNoiseVar4Tracker: 8.0

VisualTracker:
  visualTrackerType: 1
  useColorNames: 0
  useHog: 0
  featureImgSizeLevel: 2
  featureFocusOffsetFactor_y: -0.2
  filterLr: 0.15
  filterChannelWeightsLr: 0.1
  gaussianSigma: 1.0
