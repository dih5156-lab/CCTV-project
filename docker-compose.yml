name: edgex

x-appearance-search-runtime: &appearance-search-runtime
  APPEARANCES_DB: /app/data/runtime/appearances.db
  APPEARANCE_BACKEND: ${APPEARANCE_BACKEND:-pphuman}
  APPEARANCE_MODEL_PATH: ${APPEARANCE_MODEL_PATH:-models/pphuman_attribute.onnx}
  DS_FACE_ENABLED: ${DS_FACE_ENABLED:-0}
  DS_APPEARANCE_ENABLED: ${DS_APPEARANCE_ENABLED:-1}
  DS_HELMET_ENABLED: ${DS_HELMET_ENABLED:-1}
  DS_YOLO_LABELS: ${DS_YOLO_LABELS:-person}
  APPEARANCE_CROP_DIR: ${APPEARANCE_CROP_DIR:-/app/data/runtime/appearance_crops}
  APPEARANCE_SAVE_CROPS: ${APPEARANCE_SAVE_CROPS:-true}

services:
  edgex-mqtt-broker:
    container_name: edgex-mqtt-broker
    hostname: edgex-mqtt-broker
    image: eclipse-mosquitto:2.0
    environment:
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 1883
      published: "1883"
      protocol: tcp
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -u \"$${MQTT_USER}\" -P \"$${MQTT_PASSWORD}\" -t 'health/check' -m 'ping' -q 0 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
    - type: bind
      source: ./mosquitto/mosquitto.conf
      target: /mosquitto/config/mosquitto.conf
      bind:
        create_host_path: true
    - type: bind
      source: ./mosquitto/passwd
      target: /mosquitto/config/passwd
      read_only: true
      bind:
        create_host_path: true

  consul:
    command:
    - agent
    - -ui
    - -bootstrap
    - -server
    - -client
    - 0.0.0.0
    container_name: edgex-core-consul
    hostname: edgex-core-consul
    image: hashicorp/consul:1.16.2
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8500
      published: "8500"
      protocol: tcp
    read_only: true
    restart: always
    security_opt:
    - no-new-privileges:true
    user: root:root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
    - type: volume
      source: consul-config
      target: /consul/config
      volume: {}
    - type: volume
      source: consul-data
      target: /consul/data
      volume: {}
  core-common-config-bootstrapper:
    container_name: edgex-core-common-config-bootstrapper
    depends_on:
      consul:
        condition: service_healthy
    environment:
      ALL_SERVICES_DATABASE_HOST: edgex-redis
      ALL_SERVICES_MESSAGEBUS_HOST: edgex-redis
      ALL_SERVICES_REGISTRY_HOST: edgex-core-consul
      APP_SERVICES_CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
      DEVICE_SERVICES_CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
      EDGEX_SECURITY_SECRET_STORE: "false"
    hostname: edgex-core-common-config-bootstrapper
    image: edgexfoundry/core-common-config-bootstrapper:3.1.0
    networks:
      edgex-network: null
    read_only: true
    security_opt:
    - no-new-privileges:true
    user: 2002:2001
    volumes:
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
      bind:
        create_host_path: true
  core-data:
    container_name: edgex-core-data
    depends_on:
      consul:
        condition: service_healthy
      core-metadata:
        condition: service_started
      database:
        condition: service_healthy
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-core-data
    hostname: edgex-core-data
    image: edgexfoundry/core-data:3.1.0
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 59880
      published: "59880"
      protocol: tcp
    read_only: true
    restart: always
    security_opt:
    - no-new-privileges:true
    user: 2002:2001
    volumes:
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
      bind:
        create_host_path: true
  core-metadata:
    container_name: edgex-core-metadata
    depends_on:
      consul:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-core-metadata
    hostname: edgex-core-metadata
    image: edgexfoundry/core-metadata:3.1.0
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 59881
      published: "59881"
      protocol: tcp
    read_only: true
    restart: always
    security_opt:
    - no-new-privileges:true
    user: 2002:2001
    volumes:
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
      bind:
        create_host_path: true
  database:
    container_name: edgex-redis
    hostname: edgex-redis
    image: redis:7.0.14-alpine
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 6379
      published: "6379"
      protocol: tcp
    read_only: true
    restart: always
    security_opt:
    - no-new-privileges:true
    user: root:root
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
    - type: volume
      source: db-data
      target: /data
      volume: {}

  aiot-parser-db:
    container_name: aiot-parser-db
    hostname: aiot-parser-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AIOT_DB_NAME:-aiot_sensor}
      POSTGRES_USER: ${AIOT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AIOT_DB_PASSWORD:-}
    networks:
      edgex-network: null
    restart: always
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${AIOT_DB_USER:-postgres} -d ${AIOT_DB_NAME:-aiot_sensor}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
    - type: volume
      source: aiot-db-data
      target: /var/lib/postgresql/data
  device-rest:
    container_name: edgex-device-rest
    depends_on:
      consul:
        condition: service_healthy
      core-data:
        condition: service_started
      core-metadata:
        condition: service_started
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-device-rest
    hostname: edgex-device-rest
    image: edgexfoundry/device-rest:3.1.0
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 59986
      published: "59986"
      protocol: tcp
    read_only: true
    restart: always
    security_opt:
    - no-new-privileges:true
    user: 2002:2001
    volumes:
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
      bind:
        create_host_path: true
  cctv-device-service:
    container_name: cctv-device-service
    # 확장: edgex-device-rest로 향대(문서만 유지, 실제 시작 안 함)
    image: edgexfoundry/device-rest:3.1.0
    profiles:
    - disabled
    restart: "no"
  rules-engine:
    container_name: edgex-kuiper
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONNECTION__EDGEX__REDISMSGBUS__PORT: "6379"
      CONNECTION__EDGEX__REDISMSGBUS__PROTOCOL: redis
      CONNECTION__EDGEX__REDISMSGBUS__SERVER: edgex-redis
      CONNECTION__EDGEX__REDISMSGBUS__TYPE: redis
      EDGEX__DEFAULT__PORT: "6379"
      EDGEX__DEFAULT__PROTOCOL: redis
      EDGEX__DEFAULT__SERVER: edgex-redis
      EDGEX__DEFAULT__TOPIC: edgex/rules-events
      EDGEX__DEFAULT__TYPE: redis
      KUIPER__BASIC__CONSOLELOG: "true"
      KUIPER__BASIC__RESTPORT: "59720"
    hostname: edgex-kuiper
    image: lfedge/ekuiper:1.11.4-alpine
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 59720
      published: "59720"
      protocol: tcp
    read_only: true
    restart: always
    security_opt:
    - no-new-privileges:true
    user: kuiper:kuiper
    volumes:
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
      bind:
        create_host_path: true
    - type: volume
      source: kuiper-data
      target: /kuiper/data
      volume: {}
    - type: volume
      source: kuiper-etc
      target: /kuiper/etc
      volume: {}
    - type: volume
      source: kuiper-log
      target: /kuiper/log
      volume: {}
    - type: volume
      source: kuiper-plugins
      target: /kuiper/plugins
      volume: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:59720/ping 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  cctv-ai-engine:
    container_name: cctv-ai-engine
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      <<: *appearance-search-runtime
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      STREAM_API_ENABLED: ${STREAM_API_ENABLED:-1}
      STREAM_PORT: ${STREAM_PORT:-8769}
      STREAM_FPS: ${STREAM_FPS:-15}
      STREAM_JPEG_QUALITY: ${STREAM_JPEG_QUALITY:-65}
      STREAM_WIDTH: ${STREAM_WIDTH:-960}
      STREAM_HEIGHT: ${STREAM_HEIGHT:-540}
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4.0"
        reservations:
          memory: 2g
    command:
    - python
    - main.py
    - --cameras
    - /app/cameras.json
    - --mqtt-broker
    - edgex-mqtt-broker
    - --mqtt-port
    - "1883"
    - --mqtt-topic-prefix
    - cctv/ai/events
    depends_on:
      edgex-mqtt-broker:
        condition: service_started
    networks:
      edgex-network: null
    ports:
    - target: 8769
      published: "${STREAM_PORT:-8769}"
      protocol: tcp
    restart: always
    volumes:
    - type: bind
      source: ./cameras.json
      target: /app/cameras.json
      bind:
        create_host_path: true
    - type: bind
      source: ./models
      target: /app/models
      bind:
        create_host_path: true
    - type: bind
      source: ./data
      target: /app/data
      bind:
        create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  cctv-edgex-adapter:
    container_name: cctv-edgex-adapter
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - python
    - runners/run_edgex_adapter.py
    - --ai-mqtt-broker
    - edgex-mqtt-broker
    - --ai-mqtt-port
    - "1883"
    - --ai-topic-prefix
    - cctv/ai/events
    - --edgex-metadata-url
    - http://edgex-core-metadata:59881
    - --edgex-data-url
    - http://edgex-core-data:59880
    - --edgex-mqtt-broker
    - edgex-mqtt-broker
    - --edgex-mqtt-port
    - "1883"
    - --service-name
    - device-rest
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: /app
      EDGEX_OUTBOX_DB: /data/runtime/event_outbox.db
      EDGEX_OUTBOX_RETRY_INTERVAL: "30"
    depends_on:
      edgex-mqtt-broker:
        condition: service_started
      core-metadata:
        condition: service_started
      core-data:
        condition: service_started
      device-rest:
        condition: service_started
    networks:
      edgex-network: null
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
    - type: bind
      source: ./data
      target: /data

  cctv-kuiper-rule-loader:
    container_name: cctv-kuiper-rule-loader
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: /app
      KUIPER_API: http://edgex-kuiper:59720
      MQTT_BROKER: edgex-mqtt-broker
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      # ── CCTV AI 임계값 ────────────────────────────────────
      INTRUSION_CONFIDENCE: ${INTRUSION_CONFIDENCE:-0.7}
      CRITICAL_CONFIDENCE: ${CRITICAL_CONFIDENCE:-0.9}
      PERSIST_HIT_COUNT: ${PERSIST_HIT_COUNT:-5}
      # ── IoT 센서 임계값 ───────────────────────────────────
      TILT_THRESHOLD: ${TILT_THRESHOLD:-10.0}
      TEMP_HIGH_THRESHOLD: ${TEMP_HIGH_THRESHOLD:-60.0}
      # ── 배포 재시도 ───────────────────────────────────────
      KUIPER_RETRY_COUNT: ${KUIPER_RETRY_COUNT:-20}
      KUIPER_RETRY_DELAY: ${KUIPER_RETRY_DELAY:-2}
    command:
    - sh
    - -c
    - |
      python runners/run_kuiper_rules.py --kuiper-api http://edgex-kuiper:59720 --rules-file kuiper/rules/cctv_intrusion_rules.json &&
      python runners/run_kuiper_rules.py --kuiper-api http://edgex-kuiper:59720 --rules-file kuiper/rules/aiot_sensor_rules.json
    depends_on:
      rules-engine:
        condition: service_started
      edgex-mqtt-broker:
        condition: service_started
    networks:
      edgex-network: null
    volumes:
    - type: bind
      source: ./runners
      target: /app/runners
      read_only: true
    - type: bind
      source: ./kuiper
      target: /app/kuiper
      read_only: true
    restart: on-failure

  cctv-alert-log-init:
    container_name: cctv-alert-log-init
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /app/data/logs /app/data/runtime && chown -R 2002:2001 /app/data"]
    network_mode: none
    volumes:
    - type: bind
      source: ./data
      target: /app/data
      bind:
        create_host_path: true
    restart: "no"

  cctv-alert-api:
    container_name: cctv-alert-api
    build:
      context: .
      dockerfile: Dockerfile.action
    depends_on:
      cctv-alert-log-init:
        condition: service_completed_successfully
      edgex-mqtt-broker:
        condition: service_started
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: /app
    command:
    - python
    - runners/run_alert_api.py
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --log-path
    - /app/data/logs/alert_api_events.jsonl
    - --sensor-log-path
    - /app/data/logs/sensor_readings.jsonl
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8000
      published: "8000"
      protocol: tcp
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
    - type: bind
      source: ./data
      target: /app/data
      bind:
        create_host_path: true

  cctv-action-layer:
    container_name: cctv-action-layer
    build:
      context: .
      dockerfile: Dockerfile.action
    command:
    - python
    - /app/runners/run_action_bridge.py
    environment:
      MQTT_BROKER: edgex-mqtt-broker
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      DB_PATH: /app/data/runtime/action_events.db
      EXTERNAL_API_URL: http://cctv-alert-api:8000/api/alerts
      ALARM_COOLDOWN: ${ACTION_ALARM_COOLDOWN:-10}
      # Speaker (InterM HTTP REST + Digest auth)
      SPEAKER_HOST: ${SPEAKER_HOST:-}
      SPEAKER_PORT: ${SPEAKER_PORT:-80}
      SPEAKER_USER: ${SPEAKER_USER:-}
      SPEAKER_PASSWORD: ${SPEAKER_PASSWORD:-}
      SPEAKER_VOLUME: ${SPEAKER_VOLUME:-10}
      SPEAKER_TTS_LANGUAGE: kor
      SPEAKER_TTS_GENDER: female
      SPEAKER_TTS_PITCH: "100"
      SPEAKER_TTS_SPEED: "100"
      SPEAKER_TTS_VOLUME: "1"
      # Signboard (Dabit TCP socket) - leave host empty to disable
      SIGNBOARD_HOST: ${SIGNBOARD_HOST:-}
      SIGNBOARD_PORT: ${SIGNBOARD_PORT:-5000}
      SIGNBOARD_BRIGHTNESS: "10"
      SIGNBOARD_TEXT_COLOR: "7"
      SIGNBOARD_BACK_COLOR: "0"
      SIGNBOARD_TEXT_SIZE: "2"
      SIGNBOARD_TEXT_SPEED: "10"
      # Siren (InterM HTTP REST + Digest auth) - leave host empty to disable
      SIREN_HOST: ${SIREN_HOST:-}
      SIREN_PORT: ${SIREN_PORT:-80}
      SIREN_USER: ${SIREN_USER:-}
      SIREN_PASSWORD: ${SIREN_PASSWORD:-}
      SIREN_AUTO_STOP: "10"
      # REST server for manual approve/reject
      REST_ENABLED: "true"
      REST_HOST: "0.0.0.0"
      REST_PORT: "8080"
      # 내부 서비스 인증 시크릿 (public-api와 동일한 값으로 설정)
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: /app
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "8080"
      protocol: tcp
    depends_on:
      edgex-mqtt-broker:
        condition: service_started
      cctv-alert-api:
        condition: service_healthy
    networks:
      edgex-network: null
      edgex-jetson-network: null
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
    - type: bind
      source: ./src
      target: /app/src
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./runners
      target: /app/runners
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./config/event_type_map.json
      target: /app/config/event_type_map.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./data
      target: /app/data
      bind:
        create_host_path: true
  # app-aiot-forwarder: removed — EdgeXForwarder in aiot-parser now handles
  # both alert-api HTTP POST and Core Data HTTP push directly.
  # Raw MQTT payloads on aiot/sensors/# are not EdgeX Event format,
  # so ASC external-mqtt trigger cannot process them without re-encoding.

  aiot-parser:
    container_name: aiot-parser
    build:
      context: .
      dockerfile: Dockerfile.parser
    env_file:
      - path: ./parser-python/.env
        required: false
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      DB_HOST: aiot-parser-db
      DB_PORT: "5432"
      DB_USER: ${AIOT_DB_USER:-postgres}
      DB_PW: ${AIOT_DB_PASSWORD:-}
      DB_NAME: ${AIOT_DB_NAME:-aiot_sensor}
      NS_PARK_MQTT_HOST: ${NS_PARK_MQTT_HOST:-edgex-mqtt-broker}
      NS_PARK_MQTT_PORT: ${NS_PARK_MQTT_PORT:-1883}
      NS_PARK_MQTT_ID: ${NS_PARK_MQTT_ID:-}
      LAB_MQTT_HOST: ${LAB_MQTT_HOST:-edgex-mqtt-broker}
      LAB_MQTT_PORT: ${LAB_MQTT_PORT:-1883}
      LAB_MQTT_ID: ${LAB_MQTT_ID:-}
      NC_PW: ${NC_PW:-}
      # EdgeX MQTT 브로커로 파싱 결과 발행
      # topic: aiot/sensors/{dev_eui}/{table_name}
      EDGEX_MQTT_HOST: edgex-mqtt-broker
      EDGEX_MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      # EdgeX Core Data 직접 push (Outbox 저장 경로)
      EDGEX_CORE_DATA_URL: http://edgex-core-data:59880
      # 로컬 SQLite Outbox 경로 (컨테이너 재시작 시에도 유지)
      EDGEX_OUTBOX_DB: /data/runtime/event_outbox.db
      EDGEX_OUTBOX_RETRY_INTERVAL: "30"
    volumes:
    - type: volume
      source: aiot-parser-data
      target: /data
    depends_on:
      aiot-parser-db:
        condition: service_healthy
      edgex-mqtt-broker:
        condition: service_started
    networks:
      edgex-network: null
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cctv-public-api:
    container_name: cctv-public-api
    build:
      context: .
      dockerfile: Dockerfile.action
    command:
    - python
    - runners/run_public_api.py
    - --host
    - 0.0.0.0
    - --port
    - "9000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 내부 서비스 URL
      ACTION_LAYER_URL: http://cctv-action-layer:8080
      ALERT_API_URL: http://cctv-alert-api:8000
      # 이벤트 로그 경로 (cctv-alert-api와 공유 볼륨)
      ALERT_LOG_PATH: /app/data/logs/alert_api_events.jsonl
      SENSOR_LOG_PATH: /app/data/logs/sensor_readings.jsonl
      SENSOR_DEVICE_MAP_PATH: /app/config/sensor_devices.json
      ALERT_FALLBACK_LOG: /app/data/logs/public_api_fallback.jsonl
      CAMERAS_JSON: /app/cameras.json
      # API Key — 프로덕션에서는 반드시 설정할 것
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
      # CORS — 서버팀 도메인으로 제한 (예: https://server.example.com)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 외형 검색 조건 DB 경로
      <<: *appearance-search-runtime
      # Rate limit 비활성화 옵션 (기본 활성화)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # 내부 서비스 인증 시크릿 (action-layer와 동일한 값으로 설정)
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      PYTHONPATH: /app
    ports:
    - mode: ingress
      host_ip: 0.0.0.0
      target: 9000
      published: "9000"
      protocol: tcp
    depends_on:
      cctv-alert-api:
        condition: service_healthy
      cctv-action-layer:
        condition: service_healthy
    networks:
      edgex-network: null
    restart: always
    volumes:
    - type: bind
      source: ./src
      target: /app/src
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./runners
      target: /app/runners
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./cameras.json
      target: /app/cameras.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./config/sensor_devices.json
      target: /app/config/sensor_devices.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./data
      target: /app/data
      bind:
        create_host_path: true
  ui:
    container_name: edgex-ui-go
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-ui-go
    hostname: edgex-ui-go
    image: nginx:1.27-alpine
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      target: 4000
      published: "4000"
      protocol: tcp
    restart: always
    security_opt:
    - no-new-privileges:true
    volumes:
    - type: bind
      source: ./web/edgex-status.html
      target: /usr/share/nginx/html/edgex-status.html
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./config/nginx/edgex-status.conf
      target: /etc/nginx/conf.d/default.conf
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
      bind:
        create_host_path: true

  public-demo-ui:
    container_name: cctv-public-demo-ui
    image: nginx:1.27-alpine
    environment:
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
    networks:
      edgex-network: null
    ports:
    - mode: ingress
      host_ip: 0.0.0.0
      target: 7000
      published: "7000"
      protocol: tcp
    restart: always
    security_opt:
    - no-new-privileges:true
    volumes:
    - type: bind
      source: ./web/public-demo.html
      target: /usr/share/nginx/html/public-demo.html
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ./config/nginx/public-demo.conf.template
      target: /etc/nginx/templates/default.conf.template
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
      bind:
        create_host_path: true

  # Prometheus / Grafana는 docker-compose.monitoring.yml 으로 분리됨 (옵션)
  # 실행: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

networks:
  edgex-network:
    name: edgex_edgex-network
    driver: bridge
  edgex-jetson-network:
    name: edgex-jetson_edgex-network
    external: true
volumes:
  consul-config:
    name: edgex_consul-config
  consul-data:
    name: edgex_consul-data
  db-data:
    name: edgex_db-data
  kuiper-data:
    name: edgex_kuiper-data
  kuiper-etc:
    name: edgex_kuiper-etc
  kuiper-log:
    name: edgex_kuiper-log
  kuiper-plugins:
    name: edgex_kuiper-plugins
  aiot-db-data:
    name: cctv_aiot-db-data
  aiot-parser-data:
    name: cctv_aiot-parser-data
