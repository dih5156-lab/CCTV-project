listener 1883 0.0.0.0

# ── 인증 설정 ────────────────────────────────────────────────────────
# password_file 을 먼저 생성하세요:
#   docker run --rm -v "$PWD/mosquitto:/mosquitto/config" eclipse-mosquitto:2.0 \
#     mosquitto_passwd -c /mosquitto/config/passwd <user>
# 활성화 시 모든 MQTT 클라이언트(ai-engine, action-layer, aiot-parser)에
# MQTT_USER / MQTT_PASSWORD 환경변수를 추가해야 합니다.
allow_anonymous false
password_file /mosquitto/config/passwd

# ── 퍼시스턴스 ───────────────────────────────────────────────────────
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
