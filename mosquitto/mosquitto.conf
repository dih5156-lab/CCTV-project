# ── 인증 설정 ────────────────────────────────────────────────────────
# [보안 주의] 프로덕션 배포 시 아래 두 줄을 활성화하고
# password_file 을 생성하세요:
#   docker exec edgex-mqtt-broker mosquitto_passwd -c /mosquitto/config/passwd <user>
# 활성화 시 모든 MQTT 클라이언트(ai-engine, action-layer, aiot-parser)에
# MQTT_USER / MQTT_PASSWORD 환경변수를 추가해야 합니다.
#
# allow_anonymous false
# password_file /mosquitto/config/passwd
allow_anonymous true

# ── 퍼시스턴스 ───────────────────────────────────────────────────────
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
