name: cctv-progress
services:
  progress-web:
    image: nginx:1.27-alpine
    pull_policy: never
    container_name: cctv-progress-web
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.25
    ports:
      # 현재 Wi-Fi 주소로 문서 서버만 연결한다. 주소 변경 시 안내 링크도 갱신한다.
      - "192.168.2.141:18081:8080"
    volumes:
      - ../../docs/planning/online:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
