worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        charset utf-8;
        autoindex off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location = /CCTV_project_progress.pdf { try_files $uri =404; }
        # 모듈 탐색에 필요한 정적 파일만 공개하고 검증 원본·기타 파일은 계속 차단한다.
        location = /module_flow.html { try_files $uri =404; }
        location = /system_module_flow.html { try_files $uri =404; }
        # 최신 A/B 구조도 한 경로만 추가하고 나머지 비공개 경로는 차단한다.
        location = /edge_module_flow.html { try_files $uri =404; }
        location = /action_intake_flow.html { try_files $uri =404; }
        location = /code_review_graph.html { try_files $uri =404; }
        location = /vendor/d3.v7.min.js { try_files $uri =404; }
        location = /vendor/D3-LICENSE.txt { try_files $uri =404; }
        location / { return 404; }
    }
}
