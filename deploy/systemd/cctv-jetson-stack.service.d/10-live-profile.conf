[Service]
# 현재 장비에서 운영 중인 이미지·설정을 재사용한다. 비밀값이 포함된 현장 프로필은 Git에 복사하지 않는다.
ExecStartPre=/usr/bin/test -r /media/sawwave/Learning11/CCTV-project/data/runtime/live_refresh_20261008/candidate.yml
# 기본 Compose만으로 재생성하면 현재 이미지·CPU OSD·소스 격리가 달라지므로 실행 조합을 고정한다.
ExecStart=
ExecStart=/usr/bin/docker compose --env-file .env.jetson -p edgex-jetson -f docker-compose.jetson.yml -f data/runtime/live_refresh_20261008/candidate.yml up -d --no-build --pull never --force-recreate --timeout 60 cctv-ai-engine cctv-public-api public-demo-ui
