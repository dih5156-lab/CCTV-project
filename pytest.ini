[tool:pytest]
testpaths  = tests
addopts    = -v --tb=short --ignore=parser-python
python_files   = test_*.py
python_classes = Test*
python_functions = test_*
# test_video.py 는 수동 실행 전용이므로 자동 수집에서 제외
collect_ignore = ["tests/test_video.py"]
# parser-python 은 별도 패키지 (독립 venv 사용)
collect_ignore_glob = ["parser-python/*"]
