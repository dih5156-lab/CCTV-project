# ARM64/Jetson override for the default EdgeX compose stack.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d
#
# Keep this file separate from docker-compose.yml so x86_64 servers can keep
# using the generated EdgeX defaults unchanged.

services:
  core-common-config-bootstrapper:
    image: edgexfoundry/core-common-config-bootstrapper:3.1.1
    platform: linux/arm64

  core-data:
    image: edgexfoundry/core-data:3.1.1
    platform: linux/arm64

  core-metadata:
    image: edgexfoundry/core-metadata:3.1.1
    platform: linux/arm64

  device-rest:
    image: edgexfoundry/device-rest:3.1.1
    platform: linux/arm64

  cctv-device-service:
    image: edgexfoundry/device-rest:3.1.1
    platform: linux/arm64

  # edgexfoundry/edgex-ui:3.1.0 does not publish a usable linux/arm64
  # manifest in this environment. Keep UI out of the default ARM64 startup path.
  ui:
    profiles:
      - amd64-ui
